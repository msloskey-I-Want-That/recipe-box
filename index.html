  <script>
    // Set the theme before first paint (same pattern as Health Tracker) so
    // there's no flash of the wrong theme while React loads.
    (function () {
      var stored = localStorage.getItem('recipe-box-theme') || '';
      var mode = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', mode);
    })();
  </script>
